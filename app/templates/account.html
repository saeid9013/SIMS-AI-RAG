{% extends 'base.html' %}{% block content %}<header class="page-header"><h1>حساب کاربری</h1></header><section class="panel narrow"><h2>تغییر رمز عبور</h2><p class="muted">پس از تغییر رمز، همه نشست‌های شما بسته می‌شود.</p><form action="/account/password" method="post"><input type="hidden" name="csrf" value="{{ user.csrf }}"><label for="current">رمز فعلی</label><input id="current" name="current" type="password" autocomplete="current-password" required><label for="new">رمز جدید</label><input id="new" name="password" type="password" autocomplete="new-password" minlength="12" maxlength="256" required><label for="repeat">تکرار رمز جدید</label><input id="repeat" name="repeat" type="password" autocomplete="new-password" minlength="12" maxlength="256" required><button class="primary" type="submit">تغییر رمز و خروج</button></form></section>{% endblock %}
